<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 282" width="1180" height="282" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <rect width="1180" height="282" fill="#FFFFFF"/>

  <text x="40" y="44" font-size="21" font-weight="700" fill="#23323D">What a customer walks through</text>
  <text x="40" y="69" font-size="14" fill="#79868F">Each step unlocks the next. Nothing can be ordered before it has been checked and priced.</text>

  <!-- rail -->
  <line x1="88" y1="160" x2="1092" y2="160" stroke="#E0785A" stroke-width="2"/>

  <g text-anchor="middle">
    <!-- 1 -->
    <circle cx="88" cy="160" r="15" fill="#E0785A"/>
    <text x="88" y="165" font-size="12.5" font-weight="700" fill="#FFFFFF">1</text>
    <text x="88" y="205" font-size="13.5" font-weight="600" fill="#23323D">Upload</text>
    <text x="88" y="224" font-size="11.5" fill="#79868F">STL or STEP,</text>
    <text x="88" y="240" font-size="11.5" fill="#79868F">or your catalogue</text>

    <!-- 2 -->
    <circle cx="255" cy="160" r="15" fill="#E0785A"/>
    <text x="255" y="165" font-size="12.5" font-weight="700" fill="#FFFFFF">2</text>
    <text x="255" y="205" font-size="13.5" font-weight="600" fill="#23323D">Material</text>
    <text x="255" y="224" font-size="11.5" fill="#79868F">assigned per face,</text>
    <text x="255" y="240" font-size="11.5" fill="#79868F">not per part</text>

    <!-- 3 -->
    <circle cx="422" cy="160" r="15" fill="#E0785A"/>
    <text x="422" y="165" font-size="12.5" font-weight="700" fill="#FFFFFF">3</text>
    <text x="422" y="205" font-size="13.5" font-weight="600" fill="#23323D">Machine</text>
    <text x="422" y="224" font-size="11.5" fill="#79868F">only those you</text>
    <text x="422" y="240" font-size="11.5" fill="#79868F">marked compatible</text>

    <!-- 4 -->
    <circle cx="589" cy="160" r="15" fill="#E0785A"/>
    <text x="589" y="165" font-size="12.5" font-weight="700" fill="#FFFFFF">4</text>
    <text x="589" y="205" font-size="13.5" font-weight="600" fill="#23323D">Finishes</text>
    <text x="589" y="224" font-size="11.5" fill="#79868F">from your surface</text>
    <text x="589" y="240" font-size="11.5" fill="#79868F">finish table</text>

    <!-- 5 -->
    <circle cx="756" cy="160" r="15" fill="#E0785A"/>
    <text x="756" y="165" font-size="12.5" font-weight="700" fill="#FFFFFF">5</text>
    <text x="756" y="205" font-size="13.5" font-weight="600" fill="#23323D">Manufacturing</text>
    <text x="756" y="222" font-size="13.5" font-weight="600" fill="#23323D">Analysis</text>
    <text x="756" y="241" font-size="11.5" fill="#79868F">runs your playbook</text>

    <!-- 6 -->
    <circle cx="923" cy="160" r="15" fill="#E0785A"/>
    <text x="923" y="165" font-size="12.5" font-weight="700" fill="#FFFFFF">6</text>
    <text x="923" y="205" font-size="13.5" font-weight="600" fill="#23323D">Economic</text>
    <text x="923" y="222" font-size="13.5" font-weight="600" fill="#23323D">Analysis</text>
    <text x="923" y="241" font-size="11.5" fill="#79868F">quantity and date</text>

    <!-- 7 -->
    <circle cx="1092" cy="160" r="15" fill="#23323D"/>
    <text x="1092" y="165" font-size="12.5" font-weight="700" fill="#FFFFFF">7</text>
    <text x="1092" y="205" font-size="13.5" font-weight="600" fill="#23323D">Commit</text>
    <text x="1092" y="224" font-size="11.5" fill="#79868F">lands in your</text>
    <text x="1092" y="240" font-size="11.5" fill="#79868F">Manufacturing Hub</text>
  </g>

  <g text-anchor="middle" font-size="11" font-weight="600" letter-spacing="0.8">
    <text x="255" y="118" fill="#9AA6AF">CONFIGURE</text>
    <text x="840" y="118" fill="#9AA6AF">CHECK &amp; PRICE</text>
  </g>
</svg>
