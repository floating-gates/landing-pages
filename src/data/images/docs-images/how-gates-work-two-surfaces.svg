<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 540" width="1180" height="540" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a2" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#9AA6AF"/>
    </marker>
  </defs>

  <rect width="1180" height="540" fill="#FFFFFF"/>

  <text x="40" y="46" font-size="23" font-weight="700" fill="#23323D">One configuration, two surfaces</text>
  <text x="40" y="72" font-size="14.5" fill="#79868F">The same machines, materials and rules drive what you see and what your customers see.</text>

  <!-- shared core -->
  <rect x="405" y="110" width="370" height="86" rx="11" fill="#23323D"/>
  <text x="590" y="145" font-size="15.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">Your factory description</text>
  <text x="590" y="170" font-size="12.5" fill="#B9C4CB" text-anchor="middle">Machines · Materials · Design Playbook · Economics</text>

  <path d="M480 200 L 300 240" stroke="#9AA6AF" stroke-width="1.6" fill="none" marker-end="url(#a2)"/>
  <path d="M700 200 L 880 240" stroke="#9AA6AF" stroke-width="1.6" fill="none" marker-end="url(#a2)"/>

  <!-- INWARD -->
  <rect x="40" y="252" width="520" height="238" rx="12" fill="#FFFFFF" stroke="#DFE4E7" stroke-width="1.6"/>
  <rect x="40" y="252" width="520" height="46" rx="12" fill="#F4F5F6"/>
  <rect x="40" y="286" width="520" height="12" fill="#F4F5F6"/>
  <line x1="40" y1="298" x2="560" y2="298" stroke="#DFE4E7"/>
  <text x="64" y="282" font-size="11.5" font-weight="700" letter-spacing="1.3" fill="#9AA6AF">INWARD</text>
  <text x="536" y="282" font-size="11.5" font-weight="600" fill="#79868F" text-anchor="end">good2manufactured agent + Manufacturing Hub</text>

  <text x="64" y="332" font-size="16.5" font-weight="700" fill="#23323D">Catch your own mistakes</text>
  <text x="64" y="360" font-size="13" fill="#5C6A73">Watches the CAD already sitting on your network and reports</text>
  <text x="64" y="380" font-size="13" fill="#5C6A73">what your machines cannot make.</text>

  <g font-size="12.5" fill="#5C6A73">
    <circle cx="70" cy="408" r="3" fill="#E0785A"/><text x="84" y="412">Continuous scan of connected directories</text>
    <circle cx="70" cy="434" r="3" fill="#E0785A"/><text x="84" y="438">Issue list scoped to the feature that caused it</text>
    <circle cx="70" cy="460" r="3" fill="#E0785A"/><text x="84" y="464">Compliance trend across scan cycles</text>
  </g>

  <!-- OUTWARD -->
  <rect x="620" y="252" width="520" height="238" rx="12" fill="#FFFFFF" stroke="#F0C4B2" stroke-width="1.6"/>
  <rect x="620" y="252" width="520" height="46" rx="12" fill="#FDF1EC"/>
  <rect x="620" y="286" width="520" height="12" fill="#FDF1EC"/>
  <line x1="620" y1="298" x2="1140" y2="298" stroke="#F0C4B2"/>
  <text x="644" y="282" font-size="11.5" font-weight="700" letter-spacing="1.3" fill="#C4674A">OUTWARD</text>
  <text x="1116" y="282" font-size="11.5" font-weight="600" fill="#C4674A" text-anchor="end">your branded online CAD</text>

  <text x="644" y="332" font-size="16.5" font-weight="700" fill="#23323D">Let customers arrive pre-checked</text>
  <text x="644" y="360" font-size="13" fill="#5C6A73">A 3D app at your own address where customers configure a</text>
  <text x="644" y="380" font-size="13" fill="#5C6A73">part, see whether you can make it, and see what it costs.</text>

  <g font-size="12.5" fill="#5C6A73">
    <circle cx="650" cy="408" r="3" fill="#E0785A"/><text x="664" y="412">Upload STL/STEP, or configure from your catalogue</text>
    <circle cx="650" cy="434" r="3" fill="#E0785A"/><text x="664" y="438">Same feasibility rules, applied before the order exists</text>
    <circle cx="650" cy="460" r="3" fill="#E0785A"/><text x="664" y="464">Quote drafted automatically, priced finally by you</text>
  </g>
</svg>
